<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient: Festive Crimson to Amber Glow -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Spark Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Golden Border -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="#fef08a" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Background Sparkling Stars -->
  <g fill="#fff" opacity="0.9">
    <!-- Top-left tiny star -->
    <path d="M14 12 L15 15 L18 16 L15 17 L14 20 L13 17 L10 16 L13 15 Z" fill="#fef08a" opacity="0.8"/>
    <!-- Bottom-right tiny star -->
    <path d="M50 44 L51 47 L54 48 L51 49 L50 52 L49 49 L46 48 L49 47 Z" fill="#fde047" opacity="0.8"/>
    <!-- Top-right spark dot -->
    <circle cx="51" cy="15" r="2" fill="#fff" opacity="0.9"/>
    <!-- Left spark dot -->
    <circle cx="12" cy="42" r="1.8" fill="#fef08a" opacity="0.75"/>
  </g>

  <!-- Big Central Firework Burst -->
  <g filter="url(#glow)">
    <!-- 8-pointed Festive Burst Star -->
    <path d="M32 10 Q32 24 22 28 Q32 32 32 46 Q32 32 42 28 Q32 24 32 10 Z" fill="url(#gold)"/>
    <path d="M14 28 Q24 28 28 22 Q32 28 46 28 Q36 28 32 34 Q32 28 14 28 Z" fill="url(#gold)"/>
    
    <!-- Diagonal Ray Accents -->
    <line x1="20" y1="16" x2="26" y2="22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="38" y2="22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="40" x2="26" y2="34" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="40" x2="38" y2="34" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bright Core Flash -->
    <circle cx="32" cy="28" r="5" fill="#ffffff"/>
    <circle cx="32" cy="28" r="8" fill="#fef08a" opacity="0.5"/>
  </g>

  <!-- Festive Rocket Silhouette Climbing Rightwards -->
  <g transform="translate(18, 22) rotate(-35)">
    <!-- Rocket stick -->
    <line x1="8" y1="20" x2="8" y2="36" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rocket flame -->
    <path d="M6 20 Q8 26 8 28 Q8 26 10 20 Z" fill="#ea580c"/>
    <path d="M7 20 Q8 24 8 25 Q8 24 9 20 Z" fill="#fde047"/>
    <!-- Rocket cylinder -->
    <rect x="5" y="6" width="6" height="14" rx="2" fill="url(#rocketBody)"/>
    <!-- Rocket nose cone -->
    <polygon points="4,6 8,0 12,6" fill="#be123c"/>
  </g>

  <!-- Subtle 'G' letter mark in the bottom center -->
  <g transform="translate(32, 54)">
    <text text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="9" fill="#ffffff" letter-spacing="1">GURU</text>
  </g>
</svg>
